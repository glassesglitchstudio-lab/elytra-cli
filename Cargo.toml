[package]
name = "elytra-cli"
version = "0.1.0"
edition = "2024"
description = "Elytra — terminal AI asistanı. Sıfırdan Rust ile yazıldı."
authors = ["Berkay Gülmez"]

[dependencies]
# TUI çatısı — terminal arayüzü için
ratatui = "0.29"
crossterm = "0.28"
# Async runtime — API çağrıları için
tokio = { version = "1", features = ["full"] }
# HTTP istemcisi — modele istek atmak için
reqwest = { version = "0.12", features = ["json"] }
# JSON serileştirme
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI argümanları
clap = { version = "4", features = ["derive"] }
# Hata yönetimi — başlangıç için en pratik kütüphane
anyhow = "1"
# Kullanıcı config dizinleri (~/.config/elytra vb.)
dirs = "5"

[profile.release]
# Release build'i küçült ve hızlandır
opt-level = 3
lto = true
strip = true
